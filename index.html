<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BE+MORE — Site em manutenção</title>
<meta name="description" content="Estamos atualizando o site para vestir a nova identidade da BE+MORE. Voltamos em breve.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --purple:       #33245F;
    --purple-light: #4A3579;
    --purple-dark:  #221942;
    --magenta:      #E7215D;
    --blue:         #333399;
    --lilac:        #993399;
    --lightblue:    #0099CC;
    --green:        #026634;
    --orange:       #F49739;
    --red:          #CC1517;
    --ink-soft:     rgba(255, 255, 255, 0.76);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 32%, var(--purple-light) 0%, var(--purple) 55%, var(--purple-dark) 100%);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    color: #ffffff;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Campo de cruzes flutuantes (marca registrada da BE+MORE) ---------- */

  .bg-crosses {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .plus {
    position: absolute;
    width: var(--s);
    height: var(--s);
    color: var(--c);
    opacity: 0;
    animation: floatCross var(--dur) ease-in-out var(--delay) infinite;
    will-change: transform, opacity;
  }

  .plus::before,
  .plus::after {
    content: "";
    position: absolute;
    background: currentColor;
    border-radius: 28%;
  }

  .plus::before { width: 100%; height: 32%; top: 34%; left: 0; }
  .plus::after  { height: 100%; width: 32%; left: 34%; top: 0; }

  @keyframes floatCross {
    0%   { transform: translate(0, 6vh) rotate(0deg) scale(0.8); opacity: 0; }
    10%  { opacity: var(--o); }
    50%  { transform: translate(var(--dx), -54vh) rotate(180deg) scale(1); }
    90%  { opacity: var(--o); }
    100% { transform: translate(0, -120vh) rotate(360deg) scale(0.85); opacity: 0; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 46%, transparent 0%, rgba(34, 25, 66, 0.6) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ---------- Conteúdo central ---------- */

  .stage {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 640px;
  }

  .logo {
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(2.4rem, 7vw, 3.75rem);
    line-height: 1;
    display: flex;
    align-items: baseline;
  }

  .logo-plus {
    color: var(--magenta);
    padding: 0 0.03em;
  }

  .logo-mark {
    display: flex;
    gap: 0.5rem;
    margin: 1.15rem 0 2.4rem;
  }

  .logo-mark .plus {
    position: static;
    width: 11px;
    height: 11px;
    opacity: 1;
    animation: none;
  }

  h1 {
    margin: 0 0 0.9rem;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 0;
    color: var(--ink-soft);
    font-size: clamp(1rem, 2.3vw, 1.125rem);
    font-weight: 400;
    line-height: 1.65;
    max-width: 36ch;
  }

  .subtitle .accent {
    color: var(--magenta);
    font-weight: 600;
  }

  .loader {
    display: flex;
    gap: 0.6rem;
    margin-top: 2.75rem;
  }

  .loader .plus {
    position: static;
    width: 10px;
    height: 10px;
    opacity: 0.3;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .loader .plus:nth-child(1) { color: var(--magenta); }
  .loader .plus:nth-child(2) { color: var(--lightblue); animation-delay: 0.18s; }
  .loader .plus:nth-child(3) { color: var(--orange); animation-delay: 0.36s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50%      { opacity: 1;    transform: scale(1.2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .plus { animation: none !important; opacity: var(--o, 1) !important; }
    .loader .plus { animation: none !important; opacity: 0.85 !important; }
  }

  @media (max-width: 480px) {
    .stage { padding: 1.5rem 1.25rem; }
    .logo-mark { gap: 0.4rem; }
  }
</style>
</head>
<body>

  <div class="bg-crosses" id="crosses" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <div class="logo" aria-label="BE+MORE">
      <span>BE</span><span class="logo-plus">+</span><span>MORE</span>
    </div>

    <div class="logo-mark" aria-hidden="true">
      <div class="plus" style="--c:#E7215D"></div>
      <div class="plus" style="--c:#333399"></div>
      <div class="plus" style="--c:#993399"></div>
      <div class="plus" style="--c:#0099CC"></div>
      <div class="plus" style="--c:#026634"></div>
      <div class="plus" style="--c:#F49739"></div>
      <div class="plus" style="--c:#CC1517"></div>
    </div>

    <h1>Site em manutenção</h1>
    <p class="subtitle">
      Estamos arrumando a casa para vestir a nova identidade da BE+MORE.
      Voltamos <span class="accent">+</span> bonitos, <span class="accent">+</span> rápidos, <span class="accent">+</span> BE+MORE.
    </p>

    <div class="loader" aria-hidden="true">
      <div class="plus"></div>
      <div class="plus"></div>
      <div class="plus"></div>
    </div>
  </main>

  <script>
    (function () {
      var colors = ['#E7215D', '#333399', '#993399', '#0099CC', '#026634', '#F49739', '#CC1517'];
      var container = document.getElementById('crosses');
      if (!container) return;

      var count = window.innerWidth < 640 ? 22 : 42;
      var frag = document.createDocumentFragment();

      for (var i = 0; i < count; i++) {
        var el = document.createElement('div');
        el.className = 'plus';

        var size  = (Math.random() * 30 + 14).toFixed(0) + 'px';
        var color = colors[i % colors.length];
        var left  = (Math.random() * 100).toFixed(1) + '%';
        var top   = (98 + Math.random() * 14).toFixed(1) + '%';
        var dur   = (Math.random() * 18 + 16).toFixed(1) + 's';
        var delay = (-Math.random() * 32).toFixed(1) + 's';
        var dx    = (Math.random() * 120 - 60).toFixed(0) + 'px';
        var o     = (Math.random() * 0.32 + 0.16).toFixed(2);

        el.style.setProperty('--s', size);
        el.style.setProperty('--c', color);
        el.style.setProperty('--dur', dur);
        el.style.setProperty('--delay', delay);
        el.style.setProperty('--dx', dx);
        el.style.setProperty('--o', o);
        el.style.left = left;
        el.style.top = top;

        frag.appendChild(el);
      }

      container.appendChild(frag);
    })();
  </script>

</body>
</html>
